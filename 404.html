<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#292a2d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta property="og:title" content="404 - Page Not Found">
    <meta property="og:description" content="Oops! This page doesn't exist, but there's a fun game to play.">
    <meta property="og:image" content="https://josh-wilhelm.com/images/og-404.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://josh-wilhelm.com/404.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="404 - Page Not Found">
    <meta name="twitter:description" content="Oops! This page doesn't exist, but there's a fun game to play.">
    <meta name="twitter:image" content="https://josh-wilhelm.com/images/og-404.png">
    <link rel="icon" href="https://www.gravatar.com/avatar/e222a38f59325205eadc14072438f24c?s=32" type="image/png">
    <title>404 - Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #292a2d;
            --card-bg: rgba(59, 61, 66, 0.6);
            --card-border: rgba(74, 75, 80, 0.5);
            --text: #a9a9b3;
            --accent: #fe5186;
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        html {
            background-color: var(--bg-base);
        }

        body {
            position: relative;
            isolation: isolate;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background-color: #252627;
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;
            overflow-x: hidden;
            display: grid;
            place-items: center;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)) 20px;
        }

        .fx-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.35;
            mix-blend-mode: screen;
            animation: drift var(--dur, 20s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        .spark {
            position: absolute;
            top: 105%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(254, 81, 134, 0.15);
            box-shadow: 0 0 14px rgba(254, 81, 134, 0.35);
            animation: float var(--dur, 22s) linear infinite;
            animation-delay: var(--delay, 0s);
        }

        @keyframes drift {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            33% { transform: translate3d(24px, -30px, 0) scale(1.06); }
            66% { transform: translate3d(-20px, -65px, 0) scale(0.96); }
            100% { transform: translate3d(0, -95px, 0) scale(1); }
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.55; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-135vh) rotate(360deg); opacity: 0; }
        }

        .card-wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        .card {
            width: 100%;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 40px 32px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), #67cdcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            margin-bottom: 24px;
            opacity: 0.7;
            font-size: 14px;
        }

        .game-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .game-canvas {
            width: 100%;
            height: 280px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-radius: var(--radius-md);
            cursor: pointer;
            touch-action: none;
            display: block;
        }

        .game-ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            margin-bottom: 8px;
        }

        .score-display {
            font-size: 13px;
            opacity: 0.6;
        }

        .score-display span {
            font-weight: 600;
            color: var(--accent);
        }

        .game-instructions {
            font-size: 12px;
            opacity: 0.5;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .game-over-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .game-over-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .game-over-overlay h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .game-over-overlay .final-score {
            font-size: 48px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 24px;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #ff6b9d;
            border-color: #ff6b9d;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 36px;
            }

            .game-canvas {
                height: 240px;
            }
        }
    </style>
</head>
<body>
    <div class="fx-layer" id="fx" aria-hidden="true"></div>

    <main class="card-wrapper">
        <section class="card">
            <h1>404</h1>
            <p class="subtitle">Page not found... but here's a game!</p>
            
            <div class="game-ui">
                <span class="score-display">Score: <span id="score">0</span></span>
                <span class="score-display">Best: <span id="highScore">0</span></span>
            </div>
            
            <div class="game-wrapper">
                <canvas id="gameCanvas" class="game-canvas"></canvas>
                <div class="game-over-overlay" id="gameOver">
                    <h2>Game Over!</h2>
                    <div class="final-score" id="finalScore">0</div>
                    <button class="btn btn-primary" id="restartBtn">Play Again</button>
                </div>
            </div>
            
            <p class="game-instructions">Click or tap to flap</p>
            
            <a href="/" class="btn">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                Back to Home
            </a>
        </section>
    </main>

    <script>
        // Background effects
        const fxLayer = document.getElementById("fx");
        const fragment = document.createDocumentFragment();
        const orbColors = [
            "radial-gradient(circle at 35% 35%, rgba(254,81,134,0.35), rgba(254,81,134,0.05) 65%, rgba(254,81,134,0))",
            "radial-gradient(circle at 40% 30%, rgba(169,169,179,0.35), rgba(169,169,179,0.05) 62%, rgba(169,169,179,0))",
            "radial-gradient(circle at 40% 40%, rgba(103,205,204,0.35), rgba(103,205,204,0.06) 63%, rgba(103,205,204,0))"
        ];

        for (let i = 0; i < 8; i++) {
            const orb = document.createElement("div");
            const size = 120 + Math.random() * 240;
            orb.className = "orb";
            orb.style.width = `${size}px`;
            orb.style.height = `${size}px`;
            orb.style.left = `${Math.random() * 100}%`;
            orb.style.top = `${Math.random() * 100}%`;
            orb.style.background = orbColors[i % orbColors.length];
            orb.style.setProperty("--dur", `${18 + Math.random() * 20}s`);
            orb.style.setProperty("--delay", `${Math.random() * 12}s`);
            fragment.appendChild(orb);
        }

        for (let i = 0; i < 26; i++) {
            const spark = document.createElement("div");
            const size = 2 + Math.random() * 6;
            spark.className = "spark";
            spark.style.width = `${size}px`;
            spark.style.height = `${size}px`;
            spark.style.left = `${Math.random() * 100}%`;
            spark.style.setProperty("--dur", `${14 + Math.random() * 22}s`);
            spark.style.setProperty("--delay", `${Math.random() * 24}s`);
            spark.style.opacity = `${0.15 + Math.random() * 0.35}`;
            fragment.appendChild(spark);
        }

        fxLayer.appendChild(fragment);

        // Flappy Bird Game
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        let width, height, dpr;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flappyHighScore')) || 0;
        let gameRunning = false;
        let started = false;
        let animationId;

        highScoreEl.textContent = highScore;

        const bird = {
            x: 0,
            y: 0,
            width: 28,
            height: 22,
            velocity: 0,
            gravity: 0.18,
            jump: -6,
            rotation: 0
        };

        let pipes = [];
        let pipeTimer = 0;
        let gameStartTime = 0;
        let gracePeriodEnded = false;
        const pipeGap = 150;
        const pipeWidth = 50;
        const pipeSpeed = 2;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            width = rect.width;
            height = rect.height;
            bird.x = width * 0.25;
            bird.y = height / 2;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function flap() {
            if (!started) {
                startGame();
                return;
            }
            
            // Don't allow flapping during grace period
            const elapsed = performance.now() - gameStartTime;
            if (elapsed < 800) return;
            
            bird.velocity = bird.jump;
        }

        canvas.addEventListener('click', flap);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            flap();
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                flap();
            }
        });

        restartBtn.addEventListener('click', () => {
            startGame();
        });

        function createPipe() {
            const minGapY = 50;
            const maxGapY = height - pipeGap - 50;
            const gapY = minGapY + Math.random() * (maxGapY - minGapY);
            
            pipes.push({
                x: width,
                gapY: gapY,
                passed: false
            });
        }

        function update() {
            const elapsed = performance.now() - gameStartTime;
            const gracePeriod = elapsed < 800;

            // During grace period, bird stays in place with slight bob
            if (gracePeriod) {
                bird.y = height / 2 + Math.sin(elapsed * 0.01) * 5;
                bird.rotation = 0;
                return;
            }

            // First frame after grace period - give initial upward boost
            if (!gracePeriodEnded) {
                gracePeriodEnded = true;
                bird.velocity = bird.jump;
                bird.y = height / 2;
            }

            // Bird physics
            bird.velocity += bird.gravity;
            bird.velocity = Math.min(bird.velocity, 8);
            bird.y += bird.velocity;
            
            // Bird rotation based on velocity
            bird.rotation = Math.min(Math.max(bird.velocity * 3, -25), 70);

            // Bounds check
            if (bird.y < 0 || bird.y + bird.height > height) {
                endGame();
                return;
            }

            // Pipe spawning
            pipeTimer++;
            if (pipeTimer > 140) {
                createPipe();
                pipeTimer = 0;
            }

            // Update pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                const pipe = pipes[i];
                pipe.x -= pipeSpeed;

                // Collision check
                const birdRight = bird.x + bird.width;
                const birdBottom = bird.y + bird.height;
                
                if (birdRight > pipe.x && bird.x < pipe.x + pipeWidth) {
                    if (bird.y < pipe.gapY || birdBottom > pipe.gapY + pipeGap) {
                        endGame();
                        return;
                    }
                }

                // Score
                if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
                    pipe.passed = true;
                    score++;
                    scoreEl.textContent = score;
                }

                // Remove off-screen pipes
                if (pipe.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
            ctx.rotate(bird.rotation * Math.PI / 180);
            
            // Body
            ctx.fillStyle = '#fe5186';
            ctx.shadowColor = '#fe5186';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.width / 2, bird.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Wing
            ctx.fillStyle = '#ff6b9d';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.ellipse(-4, 2, 8, 5, -0.3, 0, Math.PI * 2);
            ctx.fill();
            
            // Eye
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(6, -3, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(7, -3, 2.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Beak
            ctx.fillStyle = '#f8c555';
            ctx.beginPath();
            ctx.moveTo(10, 0);
            ctx.lineTo(16, 3);
            ctx.lineTo(10, 6);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }

        function drawPipe(pipe) {
            const gradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
            gradient.addColorStop(0, '#67cdcc');
            gradient.addColorStop(1, '#4aa8a8');
            
            ctx.fillStyle = gradient;
            ctx.shadowColor = '#67cdcc';
            ctx.shadowBlur = 8;
            
            // Top pipe
            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.gapY);
            // Top pipe cap
            ctx.fillRect(pipe.x - 4, pipe.gapY - 20, pipeWidth + 8, 20);
            
            // Bottom pipe
            ctx.fillRect(pipe.x, pipe.gapY + pipeGap, pipeWidth, height - pipe.gapY - pipeGap);
            // Bottom pipe cap
            ctx.fillRect(pipe.x - 4, pipe.gapY + pipeGap, pipeWidth + 8, 20);
            
            ctx.shadowBlur = 0;
        }

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Background gradient
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#1a1a2e');
            bgGradient.addColorStop(1, '#16213e');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);
            
            // Draw stars
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < 20; i++) {
                const x = (i * 47 + performance.now() * 0.01) % width;
                const y = (i * 31) % height;
                ctx.beginPath();
                ctx.arc(x, y, 1, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw pipes
            pipes.forEach(drawPipe);

            // Draw bird
            drawBird();

            // Draw score on canvas
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = 'bold 24px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(score, width / 2, 40);

            // Show countdown during grace period
            if (started) {
                const elapsed = performance.now() - gameStartTime;
                if (elapsed < 800) {
                    const countdown = Math.ceil((800 - elapsed) / 300);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.font = 'bold 32px Inter, sans-serif';
                    ctx.fillText(countdown, width / 2, height / 2);
                }
            }

            // Start prompt
            if (!started) {
                ctx.fillStyle = 'rgba(169, 169, 179, 0.9)';
                ctx.font = '500 14px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Click to play!', width / 2, height / 2 + 60);
            }
        }

        function gameLoop() {
            if (!gameRunning) return;
            
            if (started) {
                update();
            }
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            // Cancel any existing animation loop
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            
            score = 0;
            scoreEl.textContent = score;
            bird.y = height / 2;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes = [];
            pipeTimer = 100;
            gameStartTime = performance.now();
            gracePeriodEnded = false;
            gameRunning = true;
            started = true;
            gameOverEl.classList.remove('show');
            animationId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameRunning = false;
            started = false;
            cancelAnimationFrame(animationId);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappyHighScore', highScore);
                highScoreEl.textContent = highScore;
            }
            
            finalScoreEl.textContent = score;
            gameOverEl.classList.add('show');
        }

        // Initial draw
        resizeCanvas();
        draw();
        
        // Start idle animation
        gameRunning = true;
        animationId = requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
