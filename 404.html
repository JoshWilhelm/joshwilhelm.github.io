    <style>
        .card-wrapper {
            --card-max: 480px;
        }

        h1 {
            font-size: clamp(2.25rem, 12vw, 3rem);
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            margin-bottom: 24px;
            opacity: 0.7;
            font-size: 14px;
        }

        .game-wrapper {
            position: relative;
            margin-bottom: 16px;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .game-canvas {
            width: 100%;
            max-width: 100%;
            height: min(280px, 42svh);
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-radius: var(--radius-md);
            cursor: pointer;
            touch-action: none;
            display: block;
            -webkit-tap-highlight-color: transparent;
        }

        .game-ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            margin-bottom: 8px;
        }

        .score-display {
            font-size: 13px;
            opacity: 0.6;
        }

        .score-display span {
            font-weight: 600;
            color: var(--accent);
        }

        .game-instructions {
            font-size: 12px;
            opacity: 0.5;
            margin-bottom: 20px;
        }

        .game-over-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .game-over-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .game-over-overlay h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .game-over-overlay .final-score {
            font-size: 48px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 24px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 36px;
            }

            .game-canvas {
                height: min(240px, 38svh);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .game-over-overlay {
                transition: none;
            }
        }
    </style>
</head>
<body class="layout-center">
    <div class="fx-layer" id="fx" aria-hidden="true"></div>

    <main class="card-wrapper">
        <section class="card">
            <h1>404</h1>
            <p class="subtitle">Page not found... but here's a game!</p>

            <div class="game-ui">
                <span class="score-display">Score: <span id="score">0</span></span>
                <span class="score-display">Best: <span id="highScore">0</span></span>
            </div>

            <div class="game-wrapper">
                <canvas id="gameCanvas" class="game-canvas" role="img" aria-label="Flappy bird game. Tap, click, or press Space to flap."></canvas>
                <div class="game-over-overlay" id="gameOver">
                    <h2>Game Over!</h2>
                    <div class="final-score" id="finalScore">0</div>
                    <button class="btn btn-primary" id="restartBtn" type="button">Play Again</button>
                </div>
            </div>

            <p class="game-instructions">Tap, click, or press Space to flap</p>

            <a href="/" class="btn">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                Back to Home
            </a>
        </section>
    </main>

    <script src="js/fx.js"></script>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("highScore");
        const gameOverEl = document.getElementById("gameOver");
        const finalScoreEl = document.getElementById("finalScore");
        const restartBtn = document.getElementById("restartBtn");

        let width, height, dpr;
        let score = 0;
        let highScore = parseInt(localStorage.getItem("flappyHighScore"), 10) || 0;
        let gameRunning = false;
        let started = false;
        let animationId;

        highScoreEl.textContent = highScore;

        const bird = {
            x: 0,
            y: 0,
            width: 28,
            height: 22,
            velocity: 0,
            gravity: 0.18,
            jump: -6,
            rotation: 0
        };

        let pipes = [];
        let pipeTimer = 0;
        let gameStartTime = 0;
        let gracePeriodEnded = false;
        const pipeGap = 150;
        const pipeWidth = 50;
        const pipeSpeed = 2;
        const graceMs = 800;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            width = rect.width;
            height = rect.height;
            bird.x = width * 0.25;
            if (!started) {
                bird.y = height / 2;
            }
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);
        window.addEventListener("orientationchange", () => {
            window.setTimeout(resizeCanvas, 150);
        });

        function flap() {
            if (!started) {
                startGame();
                return;
            }

            const elapsed = performance.now() - gameStartTime;
            if (elapsed < graceMs) return;

            bird.velocity = bird.jump;
        }

        canvas.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            flap();
        });

        document.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                flap();
            }
        });

        restartBtn.addEventListener("click", () => {
            startGame();
        });

        function createPipe() {
            const minGapY = 50;
            const maxGapY = height - pipeGap - 50;
            const gapY = minGapY + Math.random() * (maxGapY - minGapY);

            pipes.push({
                x: width,
                gapY: gapY,
                passed: false
            });
        }

        function update() {
            const elapsed = performance.now() - gameStartTime;
            const gracePeriod = elapsed < graceMs;

            if (gracePeriod) {
                bird.y = height / 2 + Math.sin(elapsed * 0.01) * 5;
                bird.rotation = 0;
                return;
            }

            if (!gracePeriodEnded) {
                gracePeriodEnded = true;
                bird.velocity = bird.jump;
                bird.y = height / 2;
            }

            bird.velocity += bird.gravity;
            bird.velocity = Math.min(bird.velocity, 8);
            bird.y += bird.velocity;
            bird.rotation = Math.min(Math.max(bird.velocity * 3, -25), 70);

            if (bird.y < 0 || bird.y + bird.height > height) {
                endGame();
                return;
            }

            pipeTimer += 1;
            if (pipeTimer > 140) {
                createPipe();
                pipeTimer = 0;
            }

            for (let i = pipes.length - 1; i >= 0; i -= 1) {
                const pipe = pipes[i];
                pipe.x -= pipeSpeed;

                const birdRight = bird.x + bird.width;
                const birdBottom = bird.y + bird.height;

                if (birdRight > pipe.x && bird.x < pipe.x + pipeWidth) {
                    if (bird.y < pipe.gapY || birdBottom > pipe.gapY + pipeGap) {
                        endGame();
                        return;
                    }
                }

                if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
                    pipe.passed = true;
                    score += 1;
                    scoreEl.textContent = score;
                }

                if (pipe.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
            ctx.rotate(bird.rotation * Math.PI / 180);

            ctx.fillStyle = "#fe5186";
            ctx.shadowColor = "#fe5186";
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.width / 2, bird.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ff6b9d";
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.ellipse(-4, 2, 8, 5, -0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(6, -3, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#1a1a2e";
            ctx.beginPath();
            ctx.arc(7, -3, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#f8c555";
            ctx.beginPath();
            ctx.moveTo(10, 0);
            ctx.lineTo(16, 3);
            ctx.lineTo(10, 6);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawPipe(pipe) {
            const gradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
            gradient.addColorStop(0, "#67cdcc");
            gradient.addColorStop(1, "#4aa8a8");

            ctx.fillStyle = gradient;
            ctx.shadowColor = "#67cdcc";
            ctx.shadowBlur = 8;

            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.gapY);
            ctx.fillRect(pipe.x - 4, pipe.gapY - 20, pipeWidth + 8, 20);
            ctx.fillRect(pipe.x, pipe.gapY + pipeGap, pipeWidth, height - pipe.gapY - pipeGap);
            ctx.fillRect(pipe.x - 4, pipe.gapY + pipeGap, pipeWidth + 8, 20);

            ctx.shadowBlur = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, "#1a1a2e");
            bgGradient.addColorStop(1, "#16213e");
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            for (let i = 0; i < 20; i += 1) {
                const x = (i * 47 + performance.now() * 0.01) % width;
                const y = (i * 31) % height;
                ctx.beginPath();
                ctx.arc(x, y, 1, 0, Math.PI * 2);
                ctx.fill();
            }

            pipes.forEach(drawPipe);
            drawBird();

            if (started) {
                const elapsed = performance.now() - gameStartTime;
                if (elapsed < graceMs) {
                    const countdown = Math.ceil((graceMs - elapsed) / 300);
                    ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
                    ctx.font = "bold 32px Inter, sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(String(countdown), width / 2, height / 2);
                }
            }

            if (!started) {
                ctx.fillStyle = "rgba(169, 169, 179, 0.9)";
                ctx.font = "500 14px Inter, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Tap to play!", width / 2, height / 2 + 60);
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            if (started) {
                update();
            }
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }

            score = 0;
            scoreEl.textContent = score;
            bird.y = height / 2;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes = [];
            pipeTimer = 100;
            gameStartTime = performance.now();
            gracePeriodEnded = false;
            gameRunning = true;
            started = true;
            gameOverEl.classList.remove("show");
            animationId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameRunning = false;
            started = false;
            cancelAnimationFrame(animationId);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem("flappyHighScore", highScore);
                highScoreEl.textContent = highScore;
            }

            finalScoreEl.textContent = score;
            gameOverEl.classList.add("show");
        }

        draw();
        gameRunning = true;
        animationId = requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
