<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6f69cf">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#6f69cf">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#6a62c8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>404 - Page Not Found</title>
    <style>
        :root {
            --page-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --page-base: #6f69cf;
            --text: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overscroll-behavior: none;
        }

        html {
            background-color: var(--page-base);
            background: var(--page-gradient);
        }

        body {
            position: relative;
            isolation: isolate;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--page-base);
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .fx-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.35;
            mix-blend-mode: screen;
            animation: drift var(--dur, 20s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        .spark {
            position: absolute;
            top: 105%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
            animation: float var(--dur, 22s) linear infinite;
            animation-delay: var(--delay, 0s);
        }

        .page {
            min-height: 100%;
            min-height: 100svh;
            min-height: 100dvh;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: max(1.5rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
        }

        .container {
            position: relative;
            width: min(100%, 600px);
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            margin-bottom: 0.5rem;
            font-size: 4rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            margin-bottom: 1.5rem;
            opacity: 0.9;
            font-size: 1.1rem;
            font-weight: 300;
        }

        .game-container {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            backdrop-filter: blur(10px);
        }

        .game-canvas {
            width: 100%;
            max-width: 400px;
            height: 300px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            cursor: crosshair;
            touch-action: none;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0 0.5rem;
        }

        .score, .high-score {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border: 2px solid var(--glass-border);
            border-radius: 50px;
            background: var(--glass-bg);
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            display: none;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .game-over p {
            margin-bottom: 1.5rem;
            opacity: 0.9;
        }

        .back-link {
            margin-top: 1.5rem;
        }

        @keyframes drift {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            33% { transform: translate3d(24px, -30px, 0) scale(1.06); }
            66% { transform: translate3d(-20px, -65px, 0) scale(0.96); }
            100% { transform: translate3d(0, -95px, 0) scale(1); }
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.55; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-135vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="fx-layer" id="fx" aria-hidden="true"></div>

    <main class="page">
        <div class="container">
            <h1>404</h1>
            <p class="subtitle">Page not found... but here's a game!</p>

            <div class="game-container">
                <div class="game-info">
                    <span class="score">Score: <span id="score">0</span></span>
                    <span class="high-score">High Score: <span id="highScore">0</span></span>
                </div>
                <canvas id="gameCanvas" class="game-canvas" width="400" height="300"></canvas>
                <div class="game-over" id="gameOver">
                    <h2>Game Over!</h2>
                    <p>Final Score: <span id="finalScore">0</span></p>
                    <button class="btn" onclick="startGame()">Play Again</button>
                </div>
            </div>

            <a href="/" class="btn back-link">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                Back to Home
            </a>
        </div>
    </main>

    <script>
        // Background effects
        const fxLayer = document.getElementById("fx");
        const fragment = document.createDocumentFragment();
        const orbColors = [
            "radial-gradient(circle at 35% 35%, rgba(255,255,255,0.42), rgba(255,255,255,0.05) 65%, rgba(255,255,255,0))",
            "radial-gradient(circle at 40% 30%, rgba(180,220,255,0.45), rgba(180,220,255,0.05) 62%, rgba(180,220,255,0))",
            "radial-gradient(circle at 40% 40%, rgba(213,194,255,0.42), rgba(213,194,255,0.06) 63%, rgba(213,194,255,0))"
        ];

        for (let i = 0; i < 8; i++) {
            const orb = document.createElement("div");
            const size = 120 + Math.random() * 240;
            orb.className = "orb";
            orb.style.width = `${size}px`;
            orb.style.height = `${size}px`;
            orb.style.left = `${Math.random() * 100}%`;
            orb.style.top = `${Math.random() * 100}%`;
            orb.style.background = orbColors[i % orbColors.length];
            orb.style.setProperty("--dur", `${18 + Math.random() * 20}s`);
            orb.style.setProperty("--delay", `${Math.random() * 12}s`);
            fragment.appendChild(orb);
        }

        for (let i = 0; i < 26; i++) {
            const spark = document.createElement("div");
            const size = 2 + Math.random() * 6;
            spark.className = "spark";
            spark.style.width = `${size}px`;
            spark.style.height = `${size}px`;
            spark.style.left = `${Math.random() * 100}%`;
            spark.style.setProperty("--dur", `${14 + Math.random() * 22}s`);
            spark.style.setProperty("--delay", `${Math.random() * 24}s`);
            spark.style.opacity = `${0.15 + Math.random() * 0.35}`;
            fragment.appendChild(spark);
        }

        fxLayer.appendChild(fragment);

        // Game logic
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');

        let score = 0;
        let highScore = localStorage.getItem('404gameHighScore') || 0;
        let gameRunning = false;
        let stars = [];
        let basket = { x: 175, width: 50, height: 15 };
        let animationId;
        let lastStarTime = 0;
        let starInterval = 1000;

        highScoreEl.textContent = highScore;

        // Handle canvas scaling for retina displays
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            basket.y = rect.height - 30;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Mouse/touch controls
        function updateBasketPosition(clientX) {
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            basket.x = Math.max(0, Math.min(x - basket.width / 2, rect.width - basket.width));
        }

        canvas.addEventListener('mousemove', (e) => {
            if (gameRunning) updateBasketPosition(e.clientX);
        });

        canvas.addEventListener('touchmove', (e) => {
            if (gameRunning) {
                e.preventDefault();
                updateBasketPosition(e.touches[0].clientX);
            }
        }, { passive: false });

        class Star {
            constructor() {
                const rect = canvas.getBoundingClientRect();
                this.x = Math.random() * (rect.width - 20) + 10;
                this.y = -20;
                this.size = 8 + Math.random() * 8;
                this.speed = 2 + Math.random() * 2 + (score / 50);
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
                this.color = `hsl(${Math.random() * 60 + 40}, 100%, 70%)`;
            }

            update() {
                this.y += this.speed;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;

                // Draw star shape
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
                    const x = Math.cos(angle) * this.size;
                    const y = Math.sin(angle) * this.size;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        function drawBasket() {
            const rect = canvas.getBoundingClientRect();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.roundRect(basket.x, basket.y, basket.width, basket.height, 8);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function checkCollision(star) {
            const rect = canvas.getBoundingClientRect();
            return (
                star.y + star.size > basket.y &&
                star.y - star.size < basket.y + basket.height &&
                star.x > basket.x &&
                star.x < basket.x + basket.width
            );
        }

        function gameLoop(timestamp) {
            if (!gameRunning) return;

            const rect = canvas.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);

            // Spawn new stars
            if (timestamp - lastStarTime > starInterval) {
                stars.push(new Star());
                lastStarTime = timestamp;
                // Increase difficulty
                starInterval = Math.max(400, 1000 - score * 10);
            }

            // Update and draw stars
            for (let i = stars.length - 1; i >= 0; i--) {
                const star = stars[i];
                star.update();
                star.draw();

                // Check collision with basket
                if (checkCollision(star)) {
                    score += 10;
                    scoreEl.textContent = score;
                    stars.splice(i, 1);
                    continue;
                }

                // Check if star hit bottom
                if (star.y > rect.height + 20) {
                    endGame();
                    return;
                }
            }

            drawBasket();
            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            score = 0;
            scoreEl.textContent = score;
            stars = [];
            gameRunning = true;
            gameOverEl.classList.remove('show');
            lastStarTime = performance.now();
            starInterval = 1000;
            animationId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('404gameHighScore', highScore);
                highScoreEl.textContent = highScore;
            }
            
            finalScoreEl.textContent = score;
            gameOverEl.classList.add('show');
        }

        // Start game on load
        startGame();
    </script>
</body>
</html>
