<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#292a2d">
    <meta property="og:title" content="Pay Josh Wilhelm">
    <meta property="og:description" content="Send money to Josh Wilhelm via Venmo, Cash App, PayPal, or Zelle">
    <meta property="og:image" content="https://josh-wilhelm.com/images/og-payme.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://josh-wilhelm.com/payme.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pay Josh Wilhelm">
    <meta name="twitter:description" content="Send money to Josh Wilhelm via Venmo, Cash App, PayPal, or Zelle">
    <meta name="twitter:image" content="https://josh-wilhelm.com/images/og-payme.png">
    <link rel="icon" href="https://www.gravatar.com/avatar/e222a38f59325205eadc14072438f24c?s=32" type="image/png">
    <title>Pay Josh Wilhelm</title>
    <base href="https://josh-wilhelm.com/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #292a2d;
            --card-bg: rgba(59, 61, 66, 0.6);
            --card-border: rgba(74, 75, 80, 0.5);
            --text: #a9a9b3;
            --text-muted: rgba(169, 169, 179, 0.6);
            --text-faint: rgba(169, 169, 179, 0.5);
            --accent: #fe5186;
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        html {
            background-color: var(--bg-base);
        }

        body {
            position: relative;
            isolation: isolate;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background-color: #252627;
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;
            overflow-x: hidden;
            display: grid;
            place-items: center;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)) 20px;
        }

        .fx-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.35;
            mix-blend-mode: screen;
            animation: drift var(--dur, 20s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        .spark {
            position: absolute;
            top: 105%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(254, 81, 134, 0.15);
            box-shadow: 0 0 14px rgba(254, 81, 134, 0.35);
            animation: float var(--dur, 22s) linear infinite;
            animation-delay: var(--delay, 0s);
        }

        @keyframes drift {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            33% { transform: translate3d(24px, -30px, 0) scale(1.06); }
            66% { transform: translate3d(-20px, -65px, 0) scale(0.96); }
            100% { transform: translate3d(0, -95px, 0) scale(1); }
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.55; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-135vh) rotate(360deg); opacity: 0; }
        }

        .card-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .card {
            width: 100%;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 40px 32px;
            text-align: center;
        }

        .avatar {
            width: 140px;
            height: 140px;
            margin-bottom: 24px;
            border-radius: 50%;
            border: 4px solid rgba(254, 81, 134, 0.3);
            box-shadow: 0 0 40px rgba(254, 81, 134, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(254, 81, 134, 0.5);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            margin-bottom: 32px;
            color: var(--text-muted);
            font-size: 16px;
        }

        .payment-methods {
            display: grid;
            gap: 12px;
        }

        .payment-link {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            text-decoration: none;
            text-align: left;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        button.payment-link {
            font: inherit;
        }

        .payment-link:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .payment-link:active {
            transform: translateY(0);
        }

        .payment-link:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.8);
            outline-offset: 2px;
        }

        .payment-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .venmo .payment-icon {
            background: #008cff;
        }

        .cashapp .payment-icon {
            background: linear-gradient(135deg, #00d632 0%, #00a82d 100%);
        }

        .paypal .payment-icon {
            background: linear-gradient(135deg, #0070ba 0%, #003087 100%);
        }

        .zelle .payment-icon {
            background: linear-gradient(135deg, #6b1cd0 0%, #5015a8 100%);
        }

        .payment-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .payment-name {
            display: block;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .payment-handle {
            display: block;
            max-width: 100%;
            color: var(--text-faint);
            font-family: "SF Mono", "Consolas", monospace;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .payment-action {
            flex-shrink: 0;
            min-width: 64px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }

        .payment-link.is-copied .payment-action {
            color: #0f4f22;
            background: #7ef0a4;
            border-color: #7ef0a4;
        }

        .footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .money-gif {
            display: block;
            width: 100%;
            border-radius: 12px;
        }

        @media (max-width: 480px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                padding-top: max(20px, env(safe-area-inset-top));
                padding-right: max(14px, env(safe-area-inset-right));
                padding-bottom: max(20px, env(safe-area-inset-bottom));
                padding-left: max(14px, env(safe-area-inset-left));
                overflow-x: hidden;
            }

            .card-wrapper {
                width: min(100%, 420px);
                max-width: 420px;
                margin: 0 auto;
            }

            .card {
                padding: 32px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .avatar {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="fx-layer" id="fx" aria-hidden="true"></div>

    <main class="card-wrapper" style="position: relative; z-index: 1;">
        <section class="card" aria-label="Payment links for Josh Wilhelm">
            <img src="https://www.gravatar.com/avatar/e222a38f59325205eadc14072438f24c?s=200&d=identicon" alt="Josh Wilhelm" class="avatar">
            <h1>Josh Wilhelm</h1>
            <p class="subtitle">send me money</p>

            <div class="payment-methods">
                <a href="https://venmo.com/Joshua-Wilhelm" target="_blank" rel="noreferrer" class="payment-link venmo">
                    <span class="payment-icon" aria-hidden="true">V</span>
                    <span class="payment-info">
                        <span class="payment-name">Venmo</span>
                        <span class="payment-handle">@Joshua-Wilhelm</span>
                    </span>
                    <span class="payment-action" aria-hidden="true">Open</span>
                </a>

                <a href="https://cash.app/$joshwilhelm" target="_blank" rel="noreferrer" class="payment-link cashapp">
                    <span class="payment-icon" aria-hidden="true">$</span>
                    <span class="payment-info">
                        <span class="payment-name">Cash App</span>
                        <span class="payment-handle">$joshwilhelm</span>
                    </span>
                    <span class="payment-action" aria-hidden="true">Open</span>
                </a>

                <a href="https://www.paypal.com/paypalme/joshwilhelm" target="_blank" rel="noreferrer" class="payment-link paypal">
                    <span class="payment-icon" aria-hidden="true">P</span>
                    <span class="payment-info">
                        <span class="payment-name">PayPal</span>
                        <span class="payment-handle">@joshwilhelm</span>
                    </span>
                    <span class="payment-action" aria-hidden="true">Open</span>
                </a>

                <button class="payment-link zelle" type="button" data-copy="wilhelm.josh@gmail.com" data-label="Zelle email">
                    <span class="payment-icon" aria-hidden="true">Z</span>
                    <span class="payment-info">
                        <span class="payment-name">Zelle</span>
                        <span class="payment-handle">wilhelm.josh@gmail.com</span>
                    </span>
                    <span class="payment-action" data-copy-indicator>Copy</span>
                </button>
            </div>

            <footer class="footer">
                <img src="images/money please.gif" alt="Money Please" class="money-gif">
            </footer>
        </section>
    </main>

    <script>
        const fxLayer = document.getElementById("fx");
        const fragment = document.createDocumentFragment();
        const orbColors = [
            "radial-gradient(circle at 35% 35%, rgba(254,81,134,0.35), rgba(254,81,134,0.05) 65%, rgba(254,81,134,0))",
            "radial-gradient(circle at 40% 30%, rgba(169,169,179,0.35), rgba(169,169,179,0.05) 62%, rgba(169,169,179,0))",
            "radial-gradient(circle at 40% 40%, rgba(103,205,204,0.35), rgba(103,205,204,0.06) 63%, rgba(103,205,204,0))"
        ];

        for (let i = 0; i < 8; i += 1) {
            const orb = document.createElement("div");
            const size = 120 + Math.random() * 240;
            orb.className = "orb";
            orb.style.width = `${size}px`;
            orb.style.height = `${size}px`;
            orb.style.left = `${Math.random() * 100}%`;
            orb.style.top = `${Math.random() * 100}%`;
            orb.style.background = orbColors[i % orbColors.length];
            orb.style.setProperty("--dur", `${18 + Math.random() * 20}s`);
            orb.style.setProperty("--delay", `${Math.random() * 12}s`);
            fragment.appendChild(orb);
        }

        for (let i = 0; i < 26; i += 1) {
            const spark = document.createElement("div");
            const size = 2 + Math.random() * 6;
            spark.className = "spark";
            spark.style.width = `${size}px`;
            spark.style.height = `${size}px`;
            spark.style.left = `${Math.random() * 100}%`;
            spark.style.setProperty("--dur", `${14 + Math.random() * 22}s`);
            spark.style.setProperty("--delay", `${Math.random() * 24}s`);
            spark.style.opacity = `${0.15 + Math.random() * 0.35}`;
            fragment.appendChild(spark);
        }

        fxLayer.appendChild(fragment);

        function legacyCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.setAttribute("readonly", "");
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            textArea.setSelectionRange(0, text.length);
            document.execCommand("copy");
            document.body.removeChild(textArea);
        }

        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
                legacyCopy(text);
                return true;
            } catch {
                try {
                    legacyCopy(text);
                    return true;
                } catch {
                    // Intentionally silent per request.
                    return false;
                }
            }
        }

        document.querySelectorAll("[data-copy]").forEach((el) => {
            let resetTimer;
            const indicator = el.querySelector("[data-copy-indicator]");

            el.addEventListener("click", async () => {
                const copied = await copyToClipboard(el.dataset.copy);
                if (!copied || !indicator) {
                    return;
                }

                el.classList.add("is-copied");
                indicator.textContent = "Copied";
                window.clearTimeout(resetTimer);
                resetTimer = window.setTimeout(() => {
                    el.classList.remove("is-copied");
                    indicator.textContent = "Copy";
                }, 1800);
            });
        });
    </script>
</body>
</html>
