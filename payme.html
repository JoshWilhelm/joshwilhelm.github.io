<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#292a2d">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#292a2d">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#292a2d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pay Josh">
    <meta name="description" content="Send money to Josh Wilhelm via Venmo, Cash App, PayPal, or Zelle.">
    <link rel="canonical" href="https://josh-wilhelm.com/payme.html">
    <meta property="og:site_name" content="Josh Wilhelm">
    <meta property="og:title" content="Pay Josh Wilhelm">
    <meta property="og:description" content="Send money to Josh Wilhelm via Venmo, Cash App, PayPal, or Zelle">
    <meta property="og:image" content="https://josh-wilhelm.com/images/og-payme.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://josh-wilhelm.com/payme.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pay Josh Wilhelm">
    <meta name="twitter:description" content="Send money to Josh Wilhelm via Venmo, Cash App, PayPal, or Zelle">
    <meta name="twitter:image" content="https://josh-wilhelm.com/images/og-payme.png">
    <link rel="icon" href="https://www.gravatar.com/avatar/e222a38f59325205eadc14072438f24c?s=32" type="image/png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <title>Pay Josh Wilhelm</title>
    <base href="https://josh-wilhelm.com/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <style>
        h1 {
            font-size: clamp(1.5rem, 6vw, 1.75rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .subtitle {
            margin-bottom: 32px;
            color: var(--text-muted);
            font-size: 16px;
        }

        .payment-methods {
            display: grid;
            gap: 12px;
        }

        .payment-link {
            width: 100%;
            min-width: 0;
            min-height: 72px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            text-decoration: none;
            text-align: left;
            cursor: pointer;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        button.payment-link {
            font: inherit;
        }

        .payment-link:active {
            transform: scale(0.99);
            background: rgba(255, 255, 255, 0.15);
        }

        .payment-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .venmo .payment-icon { background: #008cff; }
        .cashapp .payment-icon { background: linear-gradient(135deg, #00d632 0%, #00a82d 100%); }
        .paypal .payment-icon { background: linear-gradient(135deg, #0070ba 0%, #003087 100%); }
        .zelle .payment-icon { background: linear-gradient(135deg, #6b1cd0 0%, #5015a8 100%); }

        .payment-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .payment-name {
            display: block;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .payment-handle {
            display: block;
            max-width: 100%;
            color: var(--text-faint);
            font-family: ui-monospace, "SF Mono", "Consolas", monospace;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .payment-action {
            flex-shrink: 0;
            min-width: 64px;
            min-height: 28px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }

        .payment-link.is-copied .payment-action {
            color: #0f4f22;
            background: #7ef0a4;
            border-color: #7ef0a4;
        }

        .footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .money-gif {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 12px;
        }

        @media (hover: hover) and (pointer: fine) {
            .payment-link:hover {
                background: rgba(255, 255, 255, 0.15);
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            }
        }
    </style>
</head>
<body class="layout-center">
    <div class="fx-layer" id="fx" aria-hidden="true"></div>

    <main class="card-wrapper">
        <section class="card" aria-label="Payment links for Josh Wilhelm">
            <img src="https://www.gravatar.com/avatar/e222a38f59325205eadc14072438f24c?s=400"
                 alt="Josh Wilhelm"
                 class="avatar avatar--lg"
                 width="140"
                 height="140">
            <h1>Josh Wilhelm</h1>
            <p class="subtitle">send me money</p>

            <div class="payment-methods">
                <a href="https://venmo.com/Joshua-Wilhelm" target="_blank" rel="noreferrer" class="payment-link venmo">
                    <span class="payment-icon" aria-hidden="true">V</span>
                    <span class="payment-info">
                        <span class="payment-name">Venmo</span>
                        <span class="payment-handle">@Joshua-Wilhelm</span>
                    </span>
                    <span class="payment-action" aria-hidden="true">Open</span>
                </a>

                <a href="https://cash.app/$joshwilhelm" target="_blank" rel="noreferrer" class="payment-link cashapp">
                    <span class="payment-icon" aria-hidden="true">$</span>
                    <span class="payment-info">
                        <span class="payment-name">Cash App</span>
                        <span class="payment-handle">$joshwilhelm</span>
                    </span>
                    <span class="payment-action" aria-hidden="true">Open</span>
                </a>

                <a href="https://www.paypal.com/paypalme/joshwilhelm" target="_blank" rel="noreferrer" class="payment-link paypal">
                    <span class="payment-icon" aria-hidden="true">P</span>
                    <span class="payment-info">
                        <span class="payment-name">PayPal</span>
                        <span class="payment-handle">@joshwilhelm</span>
                    </span>
                    <span class="payment-action" aria-hidden="true">Open</span>
                </a>

                <button class="payment-link zelle" type="button" data-copy="wilhelm.josh@gmail.com" data-label="Zelle email">
                    <span class="payment-icon" aria-hidden="true">Z</span>
                    <span class="payment-info">
                        <span class="payment-name">Zelle</span>
                        <span class="payment-handle">wilhelm.josh@gmail.com</span>
                    </span>
                    <span class="payment-action" data-copy-indicator>Copy</span>
                </button>
            </div>

            <footer class="footer">
                <img src="images/money-please.gif" alt="Money Please" class="money-gif">
            </footer>
        </section>
    </main>

    <script src="js/fx.js"></script>
    <script>
        function legacyCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.setAttribute("readonly", "");
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            textArea.setSelectionRange(0, text.length);
            document.execCommand("copy");
            document.body.removeChild(textArea);
        }

        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
                legacyCopy(text);
                return true;
            } catch {
                try {
                    legacyCopy(text);
                    return true;
                } catch {
                    return false;
                }
            }
        }

        document.querySelectorAll("[data-copy]").forEach((el) => {
            let resetTimer;
            const indicator = el.querySelector("[data-copy-indicator]");

            el.addEventListener("click", async () => {
                const copied = await copyToClipboard(el.dataset.copy);
                if (!copied || !indicator) {
                    return;
                }

                el.classList.add("is-copied");
                indicator.textContent = "Copied";
                window.clearTimeout(resetTimer);
                resetTimer = window.setTimeout(() => {
                    el.classList.remove("is-copied");
                    indicator.textContent = "Copy";
                }, 1800);
            });
        });
    </script>
</body>
</html>
