<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Josh Wilhelm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 24px;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(99, 102, 241, 0.5);
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            margin-bottom: 40px;
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .payment-link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .payment-link:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .payment-link:active {
            transform: translateY(0);
        }

        .payment-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .venmo .payment-icon { background: linear-gradient(135deg, #008CFF 0%, #008CFF 100%); }
        .cashapp .payment-icon { background: linear-gradient(135deg, #00D632 0%, #00A82D 100%); }
        .paypal .payment-icon { background: linear-gradient(135deg, #0070BA 0%, #003087 100%); }
        .applepay .payment-icon { background: linear-gradient(135deg, #000000 0%, #333333 100%); }
        .zelle .payment-icon { background: linear-gradient(135deg, #6B1CD0 0%, #5015A8 100%); }

        .payment-info {
            flex: 1;
            text-align: left;
        }

        .payment-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .payment-handle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'SF Mono', 'Consolas', monospace;
        }

        .arrow {
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
            transition: transform 0.2s ease;
        }

        .payment-link:hover .arrow {
            transform: translateX(4px);
            color: rgba(255, 255, 255, 0.6);
        }

        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 24px;
            }

            h1 {
                font-size: 24px;
            }

            .avatar-container {
                width: 120px;
                height: 120px;
            }

            .avatar {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar-container">
            <img src="https://www.gravatar.com/avatar/e222a38f59325205eadc14072438f24c?s=200&d=identicon" alt="Josh Wilhelm" class="avatar">
                    </div>
        <h1>Josh Wilhelm</h1>
        <p class="subtitle">send me money</p>

        <div class="payment-methods">
            <a href="https://venmo.com/Joshua-Wilhelm" target="_blank" rel="noopener" class="payment-link venmo">
                <div class="payment-icon">V</div>
                <div class="payment-info">
                    <div class="payment-name">Venmo</div>
                    <div class="payment-handle">@Joshua-Wilhelm</div>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="https://cash.app/$joshwilhelm" target="_blank" rel="noopener" class="payment-link cashapp">
                <div class="payment-icon">$</div>
                <div class="payment-info">
                    <div class="payment-name">Cash App</div>
                    <div class="payment-handle">$joshwilhelm</div>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="https://www.paypal.com/paypalme/joshwilhelm" target="_blank" rel="noopener" class="payment-link paypal">
                <div class="payment-icon">P</div>
                <div class="payment-info">
                    <div class="payment-name">PayPal</div>
                    <div class="payment-handle">@joshwilhelm</div>
                </div>
                <span class="arrow">→</span>
            </a>

            <div class="payment-link zelle" onclick="copyToClipboard('wilhelm.josh@gmail.com', 'Zelle email')">
                <div class="payment-icon">Z</div>
                <div class="payment-info">
                    <div class="payment-name">Zelle</div>
                    <div class="payment-handle">wilhelm.josh@gmail.com</div>
                </div>
                <span class="arrow">📋</span>
            </div>
        </div>

        <div class="footer">
            <img src="images/money please.gif" alt="Money Please" style="max-width: 100%; border-radius: 12px;">
        </div>
    </div>

    <script>
        // Copy to clipboard function
        function copyToClipboard(text, label) {
            navigator.clipboard.writeText(text).then(() => {
                alert(label + ' copied to clipboard: ' + text);
            }).catch(() => {
                prompt('Copy this ' + label + ':', text);
            });
        }
    </script>
</body>
</html>
