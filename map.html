<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#292a2d">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#292a2d">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#292a2d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Travels">
    <meta name="description" content="A map of countries Josh Wilhelm has been to.">
    <link rel="canonical" href="https://josh-wilhelm.com/map.html">
    <meta property="og:site_name" content="Josh Wilhelm">
    <meta property="og:title" content="Travels - Josh Wilhelm">
    <meta property="og:description" content="A map of countries I've been to.">
    <meta property="og:image" content="https://josh-wilhelm.com/images/og-index.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://josh-wilhelm.com/map.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Travels - Josh Wilhelm">
    <meta name="twitter:description" content="A map of countries I've been to.">
    <meta name="twitter:image" content="https://josh-wilhelm.com/images/og-index.png">
    <link rel="icon" href="https://www.gravatar.com/avatar/e222a38f59325205eadc14072438f24c?s=32" type="image/png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <title>Travels - Josh Wilhelm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <style>
        .page {
            align-items: stretch;
        }

        .container {
            width: min(100%, 1080px);
            padding-top: 0.5rem;
            padding-bottom: 2rem;
        }

        h1 {
            margin-bottom: 0.35rem;
            font-size: clamp(1.6rem, 6vw, 2rem);
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .count-line {
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .count-line.is-empty {
            opacity: 0.7;
        }

        .count-line strong {
            color: var(--accent);
            font-weight: 700;
        }

        .map-shell {
            position: relative;
            width: 100%;
            min-width: 0;
            margin-bottom: 1.5rem;
            padding: 18px 16px 24px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            background: #1b1c20;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
            overflow: hidden;
        }

        #map-mount {
            width: 100%;
            min-height: 180px;
        }

        .world-map {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .world-map .ocean {
            fill: #1e2026;
        }

        .world-map .country {
            fill: #4a4c53;
            stroke: #1e2026;
            stroke-width: 1.15;
            vector-effect: non-scaling-stroke;
            cursor: pointer;
            transition: fill 0.15s ease;
        }

        .world-map .country:hover,
        .world-map .country:focus-visible {
            fill: #67cdcc;
            outline: none;
        }

        .world-map .country.visited {
            fill: var(--accent);
            filter: url(#visited-glow);
        }

        .world-map .country.visited:hover,
        .world-map .country.visited:focus-visible {
            fill: #ff7aa6;
        }

        .locator {
            pointer-events: none;
            display: none;
        }

        .locator.is-on {
            display: block;
        }

        .locator-pulse {
            fill: rgba(255, 255, 255, 0.45);
            transform-box: fill-box;
            transform-origin: center;
            animation: locator-pulse 1.15s ease-out infinite;
        }

        .locator-dot {
            fill: #fff;
            stroke: var(--accent);
            stroke-width: 4;
        }

        @keyframes locator-pulse {
            from { transform: scale(0.35); opacity: 0.9; }
            to { transform: scale(2.2); opacity: 0; }
        }

        .map-tooltip {
            position: fixed;
            z-index: 5;
            padding: 0.35rem 0.6rem;
            border-radius: 999px;
            background: rgba(20, 20, 22, 0.92);
            border: 1px solid var(--card-border);
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 500;
            pointer-events: none;
            transform: translate(-50%, calc(-100% - 10px));
            white-space: nowrap;
        }

        .hint {
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .hint code {
            font-family: ui-monospace, "SF Mono", Consolas, monospace;
            font-size: 0.85em;
            color: var(--accent-2);
        }

        .visited-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.45rem;
            margin: 0 0 1.75rem;
            padding: 0;
            list-style: none;
        }

        .visited-list button {
            appearance: none;
            font: inherit;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            border: 1px solid var(--card-border);
            background: rgba(254, 81, 134, 0.12);
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .visited-list button.is-lit {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .unmatched {
            margin-bottom: 1.25rem;
            color: #f0b429;
            font-size: 0.85rem;
            line-height: 1.45;
        }

        @media (max-width: 480px) {
            .map-shell {
                padding: 8px 2px 4px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="fx-layer" id="fx" aria-hidden="true"></div>

    <main class="page">
        <div class="container">
            <h1>Travels</h1>
            <p class="count-line" id="count-line"><strong id="visited-count">0</strong> <span id="visited-word">countries</span><span class="pct-sep"> · </span><strong id="world-pct">0%</strong> of the world</p>

            <div class="map-shell">
                <div id="map-mount"></div>
            </div>
            <div class="map-tooltip" id="map-tooltip" hidden></div>

            <p class="hint" id="map-hint" hidden>
                Add countries in <code>js/visited.js</code> — ISO codes like <code>US</code> or names like <code>Japan</code>.
            </p>
            <p class="unmatched" id="unmatched" hidden></p>
            <ul class="visited-list" id="visited-list"></ul>

            <div class="links">
                <a href="/" class="btn">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                    </svg>
                    Back to Home
                </a>
            </div>
        </div>
    </main>

    <script src="js/fx.js"></script>
    <script src="js/visited.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
