<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#292a2d">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#292a2d">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#292a2d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta property="og:title" content="Lost & Found - Josh Wilhelm">
    <meta property="og:description" content="Found something of mine? Let's get it back to me.">
    <meta property="og:image" content="https://josh-wilhelm.com/images/og-index.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://josh-wilhelm.com/lostandfound.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Lost & Found - Josh Wilhelm">
    <meta name="twitter:description" content="Found something of mine? Let's get it back to me.">
    <meta name="twitter:image" content="https://josh-wilhelm.com/images/og-index.png">
    <link rel="icon" href="https://www.gravatar.com/avatar/e222a38f59325205eadc14072438f24c?s=32" type="image/png">
    <title>Lost & Found - Josh Wilhelm</title>
    <style>
        :root {
            --page-base: #292a2d;
            --text: #a9a9b3;
            --accent: #fe5186;
            --glass-bg: rgba(59, 61, 66, 0.6);
            --glass-border: rgba(74, 75, 80, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overscroll-behavior: none;
        }

        html {
            background-color: var(--page-base);
        }

        body {
            position: relative;
            isolation: isolate;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #252627;
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        .fx-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.35;
            mix-blend-mode: screen;
            animation: drift var(--dur, 20s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        .spark {
            position: absolute;
            top: 105%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(254, 81, 134, 0.15);
            box-shadow: 0 0 14px rgba(254, 81, 134, 0.35);
            animation: float var(--dur, 22s) linear infinite;
            animation-delay: var(--delay, 0s);
        }

        .page {
            min-height: 100%;
            min-height: 100svh;
            min-height: 100dvh;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: max(1.5rem, env(safe-area-inset-top));
            padding-right: 1rem;
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
            padding-left: 1rem;
        }

        .container {
            position: relative;
            width: min(100%, 600px);
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .icon {
            margin-bottom: 2rem;
            width: 120px;
            height: 120px;
            margin-left: auto;
            margin-right: auto;
            color: var(--accent);
            filter: drop-shadow(0 0 30px rgba(254, 81, 134, 0.5));
        }

        .message {
            margin-bottom: 2rem;
            opacity: 0.9;
            font-size: 1rem;
            line-height: 1.6;
        }

        .item-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.5rem;
            margin: 0.25rem;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .item-tag svg {
            opacity: 0.9;
            vertical-align: middle;
            width: 16px;
            height: 16px;
        }

        .tags {
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border: 2px solid var(--glass-border);
            border-radius: 50px;
            background: var(--glass-bg);
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(254, 81, 134, 0.3);
        }

        @keyframes drift {
            0% {
                transform: translate3d(0, 0, 0) scale(1);
            }
            33% {
                transform: translate3d(24px, -30px, 0) scale(1.06);
            }
            66% {
                transform: translate3d(-20px, -65px, 0) scale(0.96);
            }
            100% {
                transform: translate3d(0, -95px, 0) scale(1);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.55;
            }
            80% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-135vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="fx-layer" id="fx" aria-hidden="true"></div>

    <main class="page">
        <div class="container">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0" /><path d="M15 9h.01" /></svg>
            <h1>You found something!</h1>
            
            <p class="message">
                If you've found something that belongs to me, I'd really appreciate you getting in touch. 
                I'm happy to arrange a way to get it back — just let me know what you found and how to reach you.
            </p>

            <div class="tags">
                <span class="item-tag">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16"><path d="M0 8a4 4 0 0 1 7.465-2H14a.5.5 0 0 1 .354.146l1.5 1.5a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0L13 9.207l-.646.647a.5.5 0 0 1-.708 0L11 9.207l-.646.647a.5.5 0 0 1-.708 0L9 9.207l-.646.647A.5.5 0 0 1 8 10h-.535A4 4 0 0 1 0 8m4-3a3 3 0 1 0 2.712 4.285A.5.5 0 0 1 7.163 9h.63l.853-.854a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708 0l.646.647.793-.793-1-1h-6.63a.5.5 0 0 1-.451-.285A3 3 0 0 0 4 5"/><path d="M4 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/></svg>
                    Keys
                </span>
                <span class="item-tag">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M216,64H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,56V184a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V80A16,16,0,0,0,216,64Zm0,128H56a8,8,0,0,1-8-8V78.63A23.84,23.84,0,0,0,56,80H216Zm-48-60a12,12,0,1,1,12,12A12,12,0,0,1,168,132Z"/></svg>
                    Wallet
                </span>
                <span class="item-tag">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16"><path d="M11 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM5 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/><path d="M8 14a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/></svg>
                    Phone
                </span>
                <span class="item-tag">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3" /></svg>
                    Headphones
                </span>
                <span class="item-tag">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a3 3 0 0 1 3 -3h6a3 3 0 0 1 3 3v6a3 3 0 0 1 -3 3h-6a3 3 0 0 1 -3 -3v-6z" /><path d="M9 18v3h6v-3" /><path d="M9 6v-3h6v3" /></svg>
                    Watch
                </span>
                <span class="item-tag">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l-4 5l-4 -5" /><path d="M12 19a2 2 0 0 1 -2 2h-4a2 2 0 0 1 -2 -2v-8.172a2 2 0 0 1 .586 -1.414l.828 -.828a2 2 0 0 0 .586 -1.414v-2.172a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v2.172a2 2 0 0 0 .586 1.414l.828 .828a2 2 0 0 1 .586 1.414v8.172a2 2 0 0 1 -2 2h-4a2 2 0 0 1 -2 -2z" /><path d="M20 13h-3a1 1 0 0 0 -1 1v2a1 1 0 0 0 1 1h3" /><path d="M4 17h3a1 1 0 0 0 1 -1v-2a1 1 0 0 0 -1 -1h-3" /><path d="M12 19v-11" /></svg>
                    Jacket
                </span>
            </div>

            <a href="mailto:lostandfound@josh-wilhelm.com" class="btn">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"></path>
                </svg>
                Contact Me
            </a>
        </div>
    </main>

    <script>
        const fxLayer = document.getElementById("fx");
        const fragment = document.createDocumentFragment();
        const orbColors = [
            "radial-gradient(circle at 35% 35%, rgba(254,81,134,0.35), rgba(254,81,134,0.05) 65%, rgba(254,81,134,0))",
            "radial-gradient(circle at 40% 30%, rgba(169,169,179,0.35), rgba(169,169,179,0.05) 62%, rgba(169,169,179,0))",
            "radial-gradient(circle at 40% 40%, rgba(103,205,204,0.35), rgba(103,205,204,0.06) 63%, rgba(103,205,204,0))"
        ];

        for (let i = 0; i < 8; i += 1) {
            const orb = document.createElement("div");
            const size = 120 + Math.random() * 240;
            orb.className = "orb";
            orb.style.width = `${size}px`;
            orb.style.height = `${size}px`;
            orb.style.left = `${Math.random() * 100}%`;
            orb.style.top = `${Math.random() * 100}%`;
            orb.style.background = orbColors[i % orbColors.length];
            orb.style.setProperty("--dur", `${18 + Math.random() * 20}s`);
            orb.style.setProperty("--delay", `${Math.random() * 12}s`);
            fragment.appendChild(orb);
        }

        for (let i = 0; i < 26; i += 1) {
            const spark = document.createElement("div");
            const size = 2 + Math.random() * 6;
            spark.className = "spark";
            spark.style.width = `${size}px`;
            spark.style.height = `${size}px`;
            spark.style.left = `${Math.random() * 100}%`;
            spark.style.setProperty("--dur", `${14 + Math.random() * 22}s`);
            spark.style.setProperty("--delay", `${Math.random() * 24}s`);
            spark.style.opacity = `${0.15 + Math.random() * 0.35}`;
            fragment.appendChild(spark);
        }

        fxLayer.appendChild(fragment);
    </script>
</body>
</html>
