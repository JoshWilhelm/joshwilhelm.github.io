<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1d3557">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1d3557">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d3557">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="https://www.gravatar.com/avatar/e222a38f59325205eadc14072438f24c?s=32" type="image/png">
    <title>Josh Wilhelm</title>
    <style>
        :root {
            --page-gradient: linear-gradient(90deg, #24243e, #1d3557);
            --page-base: #1d3557;
            --text: #f1faee;
            --teal: #00b3a4;
            --blue: #a8dadc;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(168, 218, 220, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overscroll-behavior: none;
        }

        html {
            background-color: var(--page-base);
            background: var(--page-gradient);
        }

        body {
            position: relative;
            isolation: isolate;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--page-base);
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        .fx-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.35;
            mix-blend-mode: screen;
            animation: drift var(--dur, 20s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        .spark {
            position: absolute;
            top: 105%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
            animation: float var(--dur, 22s) linear infinite;
            animation-delay: var(--delay, 0s);
        }

        .page {
            min-height: 100%;
            min-height: 100svh;
            min-height: 100dvh;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: max(1.5rem, env(safe-area-inset-top));
            padding-right: 1rem;
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
            padding-left: 1rem;
        }

        .container {
            position: relative;
            width: min(100%, 600px);
            margin: 0 auto;
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin-bottom: 1.5rem;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        h1 {
            margin-bottom: 0.5rem;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            margin-bottom: 1.5rem;
            opacity: 0.9;
            font-size: 1rem;
            font-weight: 300;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border: 2px solid var(--glass-border);
            border-radius: 50px;
            background: var(--glass-bg);
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        @keyframes drift {
            0% {
                transform: translate3d(0, 0, 0) scale(1);
            }
            33% {
                transform: translate3d(24px, -30px, 0) scale(1.06);
            }
            66% {
                transform: translate3d(-20px, -65px, 0) scale(0.96);
            }
            100% {
                transform: translate3d(0, -95px, 0) scale(1);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.55;
            }
            80% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-135vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="fx-layer" id="fx" aria-hidden="true"></div>

    <main class="page">
        <div class="container">
            <img src="https://www.gravatar.com/avatar/e222a38f59325205eadc14072438f24c?s=300"
                 alt="Joshua Wilhelm"
                 class="avatar">
            <h1>Josh Wilhelm</h1>
            <p class="subtitle">Developer &amp; Builder</p>

            <div class="links">
                <a href="https://github.com/joshwilhelm" class="btn" target="_blank" rel="noreferrer">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path>
                    </svg>
                    GitHub
                </a>
                <a href="mailto:wilhelm.josh@gmail.com" class="btn">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"></path>
                    </svg>
                    Email
                </a>
            </div>
        </div>
    </main>

    <script>
        const fxLayer = document.getElementById("fx");
        const fragment = document.createDocumentFragment();
        const orbColors = [
            "radial-gradient(circle at 35% 35%, rgba(255,255,255,0.42), rgba(255,255,255,0.05) 65%, rgba(255,255,255,0))",
            "radial-gradient(circle at 40% 30%, rgba(180,220,255,0.45), rgba(180,220,255,0.05) 62%, rgba(180,220,255,0))",
            "radial-gradient(circle at 40% 40%, rgba(213,194,255,0.42), rgba(213,194,255,0.06) 63%, rgba(213,194,255,0))"
        ];

        for (let i = 0; i < 8; i += 1) {
            const orb = document.createElement("div");
            const size = 120 + Math.random() * 240;
            orb.className = "orb";
            orb.style.width = `${size}px`;
            orb.style.height = `${size}px`;
            orb.style.left = `${Math.random() * 100}%`;
            orb.style.top = `${Math.random() * 100}%`;
            orb.style.background = orbColors[i % orbColors.length];
            orb.style.setProperty("--dur", `${18 + Math.random() * 20}s`);
            orb.style.setProperty("--delay", `${Math.random() * 12}s`);
            fragment.appendChild(orb);
        }

        for (let i = 0; i < 26; i += 1) {
            const spark = document.createElement("div");
            const size = 2 + Math.random() * 6;
            spark.className = "spark";
            spark.style.width = `${size}px`;
            spark.style.height = `${size}px`;
            spark.style.left = `${Math.random() * 100}%`;
            spark.style.setProperty("--dur", `${14 + Math.random() * 22}s`);
            spark.style.setProperty("--delay", `${Math.random() * 24}s`);
            spark.style.opacity = `${0.15 + Math.random() * 0.35}`;
            fragment.appendChild(spark);
        }

        fxLayer.appendChild(fragment);
    </script>
</body>
</html>
